kind = "web"
previewPath = "/"
title = "LinkSage AI"
description = "AI-powered pre-click URL risk analysis that explains suspicious signals in plain English."
version = "1.0.0"
id = "artifacts/phishguard-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24262

[services.development]
run = "pnpm --filter @workspace/phishguard-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/phishguard-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/phishguard-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24262"
BASE_PATH = "/"
